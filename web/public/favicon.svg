<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JobHunt India">
  <title>JobHunt India — the climb</title>
  <defs>
    <style>
      .ink { stroke: #08090D; stroke-linejoin: round; stroke-linecap: round; }
      .blue { fill: #287BFF; }
      .red { fill: #FF304F; }
      .skin { fill: #E8B48F; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Two chunky steps fill the lower half so the mark reads at 16px -->
  <path
    d="M2 30 V25 H13 V20 H30 V30 Z"
    fill="#FFFFFF"
    class="ink"
    stroke-width="1.2"
  />
  <path d="M2 25 H13" stroke="#287BFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0s" repeatCount="indefinite" />
  </path>
  <path d="M13 20 H30" stroke="#287BFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Back arm -->
  <g transform="translate(18.2, 10.4)">
    <g transform="rotate(10)">
      <path d="M0 0 L-1.4 2 L-2 3.8" class="ink" stroke="#08090D" stroke-width="3.8" fill="none" />
      <path d="M0 0 L-1.4 2 L-2 3.8" stroke="#287BFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-2" cy="3.8" r="1.2" class="skin ink" stroke-width="0.9" />
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Back leg -->
  <g transform="translate(19.6, 16.4)">
    <g transform="rotate(-12)">
      <path d="M0 0 L-0.6 1.8 L-1.2 3.6" class="ink" stroke="#08090D" stroke-width="4" fill="none" />
      <path d="M0 0 L-0.6 1.8 L-1.2 3.6" stroke="#287BFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="-2.6" y="3.2" width="2.6" height="1.4" rx="0.7" fill="#08090D" />
      <animateTransform attributeName="transform" type="rotate" values="-9;9;-9" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Neck -->
  <rect x="20.3" y="8.6" width="1.4" height="1.4" rx="0.5" class="skin ink" stroke-width="0.8" />

  <!-- Torso and white tee -->
  <path d="M17.6 9.8 L24.4 9.8 L25.4 16.4 L16.6 16.4 Z" class="blue ink" stroke-width="1.1" />
  <path d="M19.4 9.9 L22.6 9.9 L23 16.1 L19 16.1 Z" class="white" />
  <path d="M17.9 12.2 L24.1 11.2" stroke="#FF304F" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Front leg -->
  <g transform="translate(22.4, 16.4)">
    <g transform="rotate(12)">
      <path d="M0 0 L0.6 1.8 L1.2 3.6" class="ink" stroke="#08090D" stroke-width="4" fill="none" />
      <path d="M0 0 L0.6 1.8 L1.2 3.6" stroke="#287BFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="0" y="3.2" width="2.6" height="1.4" rx="0.7" fill="#08090D" />
      <animateTransform attributeName="transform" type="rotate" values="9;-9;9" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Front arm -->
  <g transform="translate(23.8, 10.4)">
    <g transform="rotate(-10)">
      <path d="M0 0 L1.4 2 L2 3.8" class="ink" stroke="#08090D" stroke-width="3.8" fill="none" />
      <path d="M0 0 L1.4 2 L2 3.8" stroke="#287BFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="2" cy="3.8" r="1.2" class="skin ink" stroke-width="0.9" />
      <animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Head and red cap -->
  <circle cx="21" cy="5.8" r="3.1" class="skin ink" stroke-width="1.1" />
  <path d="M17.9 4.8 Q21 1.8 24.1 4.8 L24.1 5.4 L17.9 5.4 Z" class="red ink" stroke-width="0.9" />
  <path d="M23.9 5 L25.4 5" stroke="#FF304F" stroke-width="1.6" stroke-linecap="round" />
</svg>
