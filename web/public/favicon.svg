<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JobHunt India">
  <title>JobHunt India — the climb</title>
  <defs>
    <style>
      .ink { stroke: #08090D; stroke-linejoin: round; stroke-linecap: round; }
      .blue { fill: #287BFF; }
      .red { fill: #FF304F; }
      .skin { fill: #E8B48F; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Staircase: bold, high-contrast, transparent background -->
  <path
    d="M2 29 V26 H9 V22 H16 V18 H23 V14 H30 V29 Z"
    fill="#FFFFFF"
    class="ink"
    stroke-width="1.1"
  />

  <!-- Blue tread lips shimmer upward -->
  <path d="M2 26 H9" stroke="#287BFF" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0s" repeatCount="indefinite" />
  </path>
  <path d="M9 22 H16" stroke="#287BFF" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
  </path>
  <path d="M16 18 H23" stroke="#287BFF" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
  </path>
  <path d="M23 14 H30" stroke="#287BFF" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
  </path>

  <!-- Destination flag on the top step -->
  <g transform="translate(27.4, 14)">
    <path d="M0 0 V-5.8" class="ink" stroke="#08090D" stroke-width="1.2" />
    <g transform="translate(0, -5.8)">
      <path d="M0 0 L3.2 1.2 L0 2.4 Z" fill="#FF304F" class="ink" stroke-width="0.7">
        <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <!-- Back arm -->
  <g transform="translate(17.3, 10.9)">
    <g transform="rotate(8)">
      <path d="M0 0 L-1.2 1.7 L-1.8 2.9" class="ink" stroke="#08090D" stroke-width="3.4" fill="none" />
      <path d="M0 0 L-1.2 1.7 L-1.8 2.9" stroke="#287BFF" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-1.8" cy="2.9" r="1" class="skin ink" stroke-width="0.8" />
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Back leg -->
  <g transform="translate(18.3, 16.2)">
    <g transform="rotate(-10)">
      <path d="M0 0 L-0.5 1 L-0.9 2" class="ink" stroke="#08090D" stroke-width="3.6" fill="none" />
      <path d="M0 0 L-0.5 1 L-0.9 2" stroke="#287BFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="-2" y="1.7" width="2.2" height="1.2" rx="0.6" fill="#08090D" />
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Neck -->
  <rect x="18.9" y="9.4" width="1.2" height="1.4" rx="0.4" class="skin ink" stroke-width="0.8" />

  <!-- Torso and white tee -->
  <path d="M16.9 10.2 L22.1 10.2 L23.1 16.2 L15.9 16.2 Z" class="blue ink" stroke-width="1" />
  <path d="M18.6 10.3 L20.4 10.3 L20.8 15.9 L18.2 15.9 Z" class="white" />
  <path d="M17.3 12.4 L22.3 11.6" stroke="#FF304F" stroke-width="1.3" stroke-linecap="round" fill="none" />

  <!-- Front leg -->
  <g transform="translate(20.7, 16.2)">
    <g transform="rotate(10)">
      <path d="M0 0 L0.5 1 L0.9 2" class="ink" stroke="#08090D" stroke-width="3.6" fill="none" />
      <path d="M0 0 L0.5 1 L0.9 2" stroke="#287BFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="-0.2" y="1.7" width="2.2" height="1.2" rx="0.6" fill="#08090D" />
      <animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Front arm -->
  <g transform="translate(21.7, 10.9)">
    <g transform="rotate(-8)">
      <path d="M0 0 L1.2 1.7 L1.8 2.9" class="ink" stroke="#08090D" stroke-width="3.4" fill="none" />
      <path d="M0 0 L1.2 1.7 L1.8 2.9" stroke="#287BFF" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="1.8" cy="2.9" r="1" class="skin ink" stroke-width="0.8" />
      <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="1.1s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Head and red cap -->
  <circle cx="19.5" cy="7.1" r="2.7" class="skin ink" stroke-width="1" />
  <path d="M16.8 6.1 Q19.5 3.4 22.2 6.1 L22.2 6.6 L16.8 6.6 Z" class="red ink" stroke-width="0.8" />
  <path d="M22 6.2 L23.3 6.2" stroke="#FF304F" stroke-width="1.4" stroke-linecap="round" />
</svg>
