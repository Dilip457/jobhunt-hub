<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      /* Brand colors */
      .red { fill: #FF304F; }
      .blue { fill: #287BFF; }
      .white { fill: #FFFFFF; }
      .muted { fill: #B8BECC; }

      /* Walking animation */
      @keyframes walk-up {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-16px); opacity: 0; }
      }

      @keyframes step-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      @keyframes spark-spin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }

      /* Walking figure - moves up the steps */
      .walker {
        animation: walk-up 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center bottom;
      }

      /* Steps light up as walker passes */
      .step {
        animation: step-pulse 1.5s ease-in-out infinite;
        transform-origin: center;
      }
      .step-1 { animation-delay: 0s; }
      .step-2 { animation-delay: 0.375s; }
      .step-3 { animation-delay: 0.75s; }
      .step-4 { animation-delay: 1.125s; }

      /* Spark on chest spins */
      .spark {
        animation: spark-spin 2s linear infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- No background - fully transparent -->

  <!-- Steps (minimal, subtle) -->
  <g class="steps" fill="currentColor" opacity="0.25">
    <rect class="step step-1" x="4" y="22" width="24" height="2" rx="1"/>
    <rect class="step step-2" x="6" y="17" width="20" height="2" rx="1"/>
    <rect class="step step-3" x="8" y="12" width="16" height="2" rx="1"/>
    <rect class="step step-4" x="10" y="7" width="12" height="2" rx="1"/>
  </g>

  <!-- Walker (simplified, recognizable at 16x16) -->
  <g class="walker" transform="translate(16, 24)">
    <!-- Legs -->
    <g fill="currentColor" class="blue">
      <rect x="-3" y="6" width="2.5" height="5" rx="0.5"/>  <!-- left leg -->
      <rect x="1" y="6" width="2.5" height="5" rx="0.5"/>   <!-- right leg -->
    </g>

    <!-- Body/torso -->
    <path class="blue" d="M-5 6 L-2 1 L4 1 L7 6 Z"/>

    <!-- White tee (shirt) -->
    <path class="white" d="M-2 2 L0 0.5 L3 0.5 L1 2 Z"/>

    <!-- Arms -->
    <rect class="blue" x="-6.5" y="2" width="2" height="5" rx="0.5"/>  <!-- left arm -->
    <rect class="blue" x="5" y="2" width="2" height="5" rx="0.5"/>     <!-- right arm -->

    <!-- Head -->
    <circle class="muted" cx="0" cy="-4" r="4"/>
    <!-- Hair -->
    <path fill="#2d241a" d="M-4 -7 Q0 -9 4 -7 Q4 -5 0 -4 Q-4 -5 -4 -7"/>

    <!-- Spark on chest (brand mark) -->
    <g class="spark" transform="translate(0, 2.5) scale(0.6)">
      <path class="red" d="M0 -3 L1 -1 L3 -1 L1.5 0.5 L2.5 3 L0 2 L-2.5 3 L-1.5 0.5 L-3 -1 L-1 -1 Z"/>
    </g>
  </g>
</svg>