<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      /* Step blocks */
      .step {
        fill: #151821;
        stroke: #287BFF;
        stroke-width: 0.5;
      }
      .step-top {
        fill: #1a1f2e;
      }

      /* Guide figure - simplified for 16x16 visibility */
      .guide-body {
        fill: #287BFF;
      }
      .guide-head {
        fill: #d99479;
      }
      .guide-accent {
        fill: #FF304F;
      }

      /* Walking animation */
      @keyframes walk-cycle {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        12.5% {
          transform: translate(1.5px, -0.5px) rotate(-3deg);
        }
        25% {
          transform: translate(3px, 0) rotate(0deg);
        }
        37.5% {
          transform: translate(4.5px, -0.5px) rotate(3deg);
        }
        50% {
          transform: translate(6px, 0) rotate(0deg);
        }
        62.5% {
          transform: translate(7.5px, -0.5px) rotate(-3deg);
        }
        75% {
          transform: translate(9px, 0) rotate(0deg);
        }
        87.5% {
          transform: translate(10.5px, -0.5px) rotate(3deg);
        }
        100% {
          transform: translate(12px, 0) rotate(0deg);
        }
      }

      @keyframes leg-swing {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(25deg); }
        50% { transform: rotate(0deg); }
        75% { transform: rotate(-25deg); }
      }

      @keyframes arm-swing {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-25deg); }
        50% { transform: rotate(0deg); }
        75% { transform: rotate(25deg); }
      }

      @keyframes head-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-0.3px); }
      }

      @keyframes spark-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      .guide {
        animation: walk-cycle 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 8px 24px;
      }

      .leg-left {
        animation: leg-swing 1.2s ease-in-out infinite;
        transform-origin: center top;
      }

      .leg-right {
        animation: leg-swing 1.2s ease-in-out infinite reverse;
        transform-origin: center top;
      }

      .arm-left {
        animation: arm-swing 1.2s ease-in-out infinite;
        transform-origin: center top;
      }

      .arm-right {
        animation: arm-swing 1.2s ease-in-out infinite reverse;
        transform-origin: center top;
      }

      .guide-head {
        animation: head-bob 1.2s ease-in-out infinite;
        transform-origin: center bottom;
      }

      .spark {
        animation: spark-pulse 2s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#08090D"/>

  <!-- Steps (ascending left to right) -->
  <g class="steps">
    <!-- Step 1 (bottom) -->
    <rect class="step" x="2" y="24" width="28" height="4" rx="0.5"/>
    <rect class="step-top" x="2" y="24" width="28" height="1.5"/>

    <!-- Step 2 -->
    <rect class="step" x="5" y="18" width="22" height="4" rx="0.5"/>
    <rect class="step-top" x="5" y="18" width="22" height="1.5"/>

    <!-- Step 3 -->
    <rect class="step" x="8" y="12" width="16" height="4" rx="0.5"/>
    <rect class="step-top" x="8" y="12" width="16" height="1.5"/>

    <!-- Step 4 (top) -->
    <rect class="step" x="11" y="6" width="10" height="4" rx="0.5"/>
    <rect class="step-top" x="11" y="6" width="10" height="1.5"/>
  </g>

  <!-- Guide walking up steps -->
  <g class="guide">
    <!-- Left leg -->
    <g class="leg-left">
      <ellipse class="guide-body" cx="9" cy="21" rx="1.2" ry="3"/>
      <ellipse class="guide-body" cx="9" cy="24.5" rx="1.5" ry="1.5"/> <!-- foot -->
    </g>

    <!-- Right leg -->
    <g class="leg-right">
      <ellipse class="guide-body" cx="12.5" cy="21" rx="1.2" ry="3"/>
      <ellipse class="guide-body" cx="12.5" cy="24.5" rx="1.5" ry="1.5"/> <!-- foot -->
    </g>

    <!-- Torso -->
    <path class="guide-body" d="M7.5 16.5 L10 11.5 L14 11.5 L16.5 16.5 Z"/>

    <!-- Jacket opening (white tee) -->
    <path class="guide-body" fill="#ffffff" d="M9.5 14 L11.5 11.5 L13.5 11.5 L11.5 14 Z"/>

    <!-- Left arm -->
    <g class="arm-left">
      <ellipse class="guide-body" cx="6" cy="14" rx="1" ry="3.5"/>
      <ellipse class="guide-body" cx="5.5" cy="18" rx="1.2" ry="1.2"/> <!-- hand -->
    </g>

    <!-- Right arm -->
    <g class="arm-right">
      <ellipse class="guide-body" cx="18" cy="14" rx="1" ry="3.5"/>
      <ellipse class="guide-body" cx="18.5" cy="18" rx="1.2" ry="1.2"/> <!-- hand -->
    </g>

    <!-- Head -->
    <g class="guide-head">
      <circle class="guide-head" cx="12" cy="9" r="3.5"/>
      <!-- Hair -->
      <path fill="#2d241a" d="M8.5 6.5 Q12 5 15.5 6.5 Q15.5 8 12 9.5 Q8.5 8 8.5 6.5"/>
      <!-- Eyes (subtle) -->
      <circle fill="#1a1a2e" cx="10.5" cy="8.5" r="0.6"/>
      <circle fill="#1a1a2e" cx="13.5" cy="8.5" r="0.6"/>
    </g>

    <!-- Spark icon on chest (brand mark) -->
    <g class="spark">
      <path fill="#FF304F" d="M12 10.5 L12.5 12 L14 12 L13 13 L13.5 14.5 L12 13.5 L10.5 14.5 L11 13 L10 12 L11.5 12 Z"/>
      <path fill="#287BFF" d="M12 10.5 L12.5 12 L14 12 L13 13 L13.5 14.5 L12 13.5 L10.5 14.5 L11 13 L10 12 L11.5 12 Z" opacity="0.7" transform="scale(0.7) translate(1, 1)"/>
    </g>

    <!-- Red accent line (jacket detail) -->
    <path class="guide-accent" d="M8 13.5 L16 13.5" stroke="#FF304F" stroke-width="0.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle glow at top step (destination) -->
  <circle fill="#287BFF" cx="16" cy="4" r="2" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>