name: Experience probe

# Fetches a few live postings per source for one role and writes a table to
# the run summary: title, what the card will say, and where it came from.
# Use it to check the posting-page parsers against the real boards.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Role track"
        required: true
        default: ba
        type: choice
        options:
          - genai
          - data
          - uiux
          - ba
          - sde
      limit:
        description: "Jobs per source"
        required: false
        default: 10
        type: number

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The data branch of this public repo is fetched anonymously.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # Inputs reach the shell only as environment variables, never as
      # ${{ }} text inside the script, and are checked before use: an API
      # dispatch can send any string, whatever the input type says.
      - name: Read the published role file
        env:
          ROLE: ${{ inputs.role }}
        run: |
          if ! [[ "$ROLE" =~ ^[a-z]+$ ]]; then
            echo "::error::Unknown role: $ROLE"
            exit 1
          fi
          git fetch origin data
          git show "origin/data:$ROLE.json" > "/tmp/$ROLE.json"

      - name: Probe live postings
        env:
          ROLE: ${{ inputs.role }}
          LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${LIMIT:-10}"
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "::error::limit must be a whole number from 1 to 999, got: $LIMIT"
            exit 1
          fi
          python automation/enrich_experience.py --probe \
            --input "/tmp/$ROLE.json" \
            --limit "$LIMIT"
