name: Scrape jobs
run-name: Scrape ${{ inputs.role || 'all' }}

on:
  schedule:
    # 07:00 IST (01:30 UTC). Linux runner, uses the cloud-safe sources only.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: "Role track to scrape"
        required: true
        default: all
        type: choice
        options:
          - all
          - genai
          - data
          - uiux

permissions:
  contents: write

concurrency:
  group: jobhunt-scrape
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Build matrix
        id: set
        working-directory: portal
        run: python automation/matrix.py --role "${{ inputs.role || 'all' }}" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: vendor/${{ matrix.role }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vendor/${{ matrix.role }}/requirements.txt

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "vendor/${{ matrix.role }}/requirements.txt"

      - name: Run pipeline and export JSON
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          python automation/run_source.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --repo-dir "${{ github.workspace }}/vendor/${{ matrix.role }}" \
            --out "artifacts/${{ matrix.role }}.json" \
            --no-playwright \
            --no-validate

      - name: Upload role artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.role }}
          path: |
            portal/artifacts/${{ matrix.role }}.json
            portal/artifacts/${{ matrix.role }}.json.status.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, scrape]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download role artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to data branch (merges with existing data)
        run: python automation/publish.py --artifacts artifacts --branch data --retention-days 21
