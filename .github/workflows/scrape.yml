name: Scrape jobs
run-name: Scrape ${{ inputs.role || 'all' }}

on:
  schedule:
    # 03:00 IST (21:30 UTC previous day), earlier to absorb scheduler delays.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: "Role track to scrape"
        required: true
        default: all
        type: choice
        options:
          - all
          - genai
          - data
          - uiux
          - ba
          - sde

permissions:
  contents: write

concurrency:
  group: jobhunt-scrape
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Build matrix
        id: set
        working-directory: portal
        run: python automation/matrix.py --role "${{ inputs.role || 'all' }}" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # One runner per role, all at once. This used to be max-parallel: 1, so
      # the roles queued and the run cost the *sum* of their durations instead
      # of the slowest one. Each role is an independent job on its own runner
      # with its own vendor checkout, so they cannot interfere.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: vendor/${{ matrix.role }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vendor/${{ matrix.role }}/requirements.txt

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "vendor/${{ matrix.role }}/requirements.txt"

      - name: Install Playwright for portal scrapers
        working-directory: portal
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pipeline and export JSON
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python automation/run_source.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --repo-dir "${{ github.workspace }}/vendor/${{ matrix.role }}" \
            --out "artifacts/${{ matrix.role }}.json" \
            --no-playwright \
            --no-apis \
            --no-validate \
            --parallel-sources 4

      - name: Fetch extra keyless sources (BA, SDE)
        if: matrix.role == 'ba' || matrix.role == 'sde'
        continue-on-error: true
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python automation/api_sources.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --out "artifacts/${{ matrix.role }}.apis.json" \
            --max-days 21 \
            --min-score 18

      - name: Upload role artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.role }}
          path: |
            portal/artifacts/${{ matrix.role }}.json
            portal/artifacts/${{ matrix.role }}.json.status.json
            portal/artifacts/${{ matrix.role }}.apis.json
          if-no-files-found: warn
          retention-days: 14

  warp:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight scraper dependencies
        working-directory: portal
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml curl_cffi

      - name: Connect Cloudflare WARP
        run: |
          curl -fsSL --max-time 60 https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo timeout 180 apt-get update -qq || true
          sudo timeout 180 apt-get install -y -qq cloudflare-warp || true
          timeout 40 warp-cli --accept-tos registration new || true
          timeout 30 warp-cli --accept-tos mode warp || true
          timeout 30 warp-cli --accept-tos connect || true
          sleep 8
          timeout 20 warp-cli --accept-tos status || true

      - name: Scrape Indeed SEO + SimplyHired
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
          WARP_SYSTEM: "1"
        run: |
          python automation/portal_scrapers.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --out "artifacts/${{ matrix.role }}.warp.json" \
            --sites indeed simplyhired \
            --max-days 14

      - name: Disconnect WARP
        if: always()
        run: |
          warp-cli --accept-tos disconnect || true
          sudo systemctl stop warp-svc || true
          sudo pkill -f warp-svc || true

      - name: Upload WARP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.role }}-warp
          path: portal/artifacts/${{ matrix.role }}.warp.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, scrape, warp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download role artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to data branch (merges with existing data)
        run: python automation/publish.py --artifacts artifacts --branch data --retention-days 21
