name: Scrape jobs
run-name: Scrape ${{ inputs.role || 'all' }}

on:
  schedule:
    # 03:00 IST (21:30 UTC previous day), earlier to absorb scheduler delays.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: "Role track to scrape"
        required: true
        default: all
        type: choice
        options:
          - all
          - genai
          - data
          - uiux
          - ba
          - sde

# Read-only by default: the scrape and warp jobs run third-party code (vendor
# repos and their unpinned requirements). Only publish gets contents: write.
permissions:
  contents: read

# One queue per role. A shared group keeps at most one pending run, so a third
# dispatch for another role silently cancelled the second. Runs for different
# roles may now publish at the same time; publish.py's force-with-lease retry
# re-reads the data branch and merges again when the other run got there first.
# The schedule has no inputs, so it shares the "all" queue with manual "all".
concurrency:
  group: jobhunt-scrape-${{ inputs.role || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal
          persist-credentials: false

      - name: Build matrix
        id: set
        working-directory: portal
        env:
          ROLE: ${{ inputs.role || 'all' }}
        run: python automation/matrix.py --role "$ROLE" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # One runner per role, all at once. This used to be max-parallel: 1, so
      # the roles queued and the run cost the *sum* of their durations instead
      # of the slowest one. Each role is an independent job on its own runner
      # with its own vendor checkout, so they cannot interfere.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal
          # Nothing in this job pushes; keep the token out of .git/config so
          # vendor code and pip packages cannot read it.
          persist-credentials: false

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          # Pin with "repo_ref" in profiles/<role>.json; empty = default branch.
          # run_source.py patches the vendor modules by name, so an unpinned
          # upstream change can silently break a role.
          ref: ${{ matrix.ref }}
          path: vendor/${{ matrix.role }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vendor/${{ matrix.role }}/requirements.txt

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "vendor/${{ matrix.role }}/requirements.txt"

      - name: Install Playwright for portal scrapers
        working-directory: portal
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch previously published data
        # Experience already read from posting pages (enrich_experience.py) is
        # reused instead of fetched again. The data branch of this public repo
        # is fetched anonymously; on a first run it is missing and every
        # unresolved job is looked up as before.
        continue-on-error: true
        timeout-minutes: 2
        working-directory: portal
        env:
          ROLE: ${{ matrix.role }}
        run: |
          mkdir -p previous
          if git fetch --quiet --depth=1 origin data; then
            git show "FETCH_HEAD:${ROLE}.json" > "previous/${ROLE}.json" || rm -f "previous/${ROLE}.json"
          fi
          ls -l previous

      - name: Run pipeline and export JSON
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
          # The dedicated WARP job retries Indeed through a clean exit IP. Here
          # the fast curl_cffi path is enough; a headed browser fallback would
          # add minutes for inventory the WARP job already collects.
          INDEED_HTTP_ONLY: "1"
        run: |
          python automation/run_source.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --repo-dir "${{ github.workspace }}/vendor/${{ matrix.role }}" \
            --out "artifacts/${{ matrix.role }}.json" \
            --no-playwright \
            --no-apis \
            --no-validate \
            --parallel-sources 4 \
            --parallel-portals 4 \
            --previous "previous/${{ matrix.role }}.json"

      - name: Fetch company career boards and keyless sources
        # Company ATS boards (automation/companies.json) for every role; the
        # remote job boards only for BA and SDE, as before. About 2-3
        # minutes, mostly Workday paging.
        continue-on-error: true
        timeout-minutes: 15
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
          ROLE: ${{ matrix.role }}
        run: |
          sources=ats
          case "$ROLE" in ba|sde) sources=all ;; esac
          python automation/api_sources.py \
            --role "$ROLE" \
            --profile "profiles/$ROLE.json" \
            --out "artifacts/$ROLE.apis.json" \
            --max-days 21 \
            --min-score 18 \
            --parallel-sources 4 \
            --sources "$sources"

      - name: Upload role artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.role }}
          path: |
            portal/artifacts/${{ matrix.role }}.json
            portal/artifacts/${{ matrix.role }}.json.status.json
            portal/artifacts/${{ matrix.role }}.apis.json
          if-no-files-found: warn
          retention-days: 14

  warp:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight scraper dependencies
        working-directory: portal
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml curl_cffi

      - name: Fetch previously published data
        # Same as in the scrape job: reuse earlier posting-page lookups.
        continue-on-error: true
        timeout-minutes: 2
        working-directory: portal
        env:
          ROLE: ${{ matrix.role }}
        run: |
          mkdir -p previous
          if git fetch --quiet --depth=1 origin data; then
            git show "FETCH_HEAD:${ROLE}.json" > "previous/${ROLE}.json" || rm -f "previous/${ROLE}.json"
          fi
          ls -l previous

      - name: Connect Cloudflare WARP
        run: |
          curl -fsSL --max-time 60 https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo timeout 180 apt-get update -qq || true
          sudo timeout 180 apt-get install -y -qq cloudflare-warp || true
          timeout 40 warp-cli --accept-tos registration new || true
          timeout 30 warp-cli --accept-tos mode warp || true
          timeout 30 warp-cli --accept-tos connect || true
          sleep 8
          timeout 20 warp-cli --accept-tos status || true

      - name: Scrape Indeed SEO + SimplyHired
        working-directory: portal
        env:
          PYTHONUNBUFFERED: "1"
          WARP_SYSTEM: "1"
        run: |
          python automation/portal_scrapers.py \
            --role "${{ matrix.role }}" \
            --profile "profiles/${{ matrix.role }}.json" \
            --out "artifacts/${{ matrix.role }}.warp.json" \
            --sites indeed simplyhired \
            --max-days 14 \
            --max-page-fetches 200 \
            --previous "previous/${{ matrix.role }}.json"

      - name: Disconnect WARP
        if: always()
        run: |
          warp-cli --accept-tos disconnect || true
          sudo systemctl stop warp-svc || true
          sudo pkill -f warp-svc || true

      - name: Upload WARP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.role }}-warp
          path: portal/artifacts/${{ matrix.role }}.warp.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, scrape, warp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes: publish.py pushes the data branch through the
    # token actions/checkout persists in .git/config (default), so keep it.
    permissions:
      contents: write
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download role artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to data branch (merges with existing data)
        run: python automation/publish.py --artifacts artifacts --branch data --retention-days 21 --unseen-days 7 --attempts 5
