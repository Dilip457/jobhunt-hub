name: Diagnose portal access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          pip install curl_cffi
          python -m playwright install --with-deps chromium

      - name: Probe curl_cffi (Chrome TLS fingerprint)
        run: python automation/indeed_probe2.py

      - name: Probe headless Chrome
        run: python automation/indeed_probe.py

      - name: Probe headed Chrome (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a python automation/indeed_probe.py --headed
