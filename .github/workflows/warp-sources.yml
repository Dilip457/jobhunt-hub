name: Test all sources via WARP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Connect Cloudflare WARP (system mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 8
          warp-cli --accept-tos status || true
          curl -s https://cloudflare.com/cdn-cgi/trace || true

      - name: Scrape all sources through WARP
        env:
          WARP_SYSTEM: "1"
        run: |
          python automation/portal_scrapers.py \
            --role uiux \
            --profile profiles/uiux.json \
            --out /tmp/uiux-warp.json \
            --max-days 14

      - name: Disconnect WARP and clean up
        if: always()
        run: |
          warp-cli --accept-tos disconnect || true
          sudo systemctl stop warp-svc || true
          sudo pkill -f warp-svc || true
          sudo pkill -f warp-cli || true
          sleep 3
          echo "cleanup done"
